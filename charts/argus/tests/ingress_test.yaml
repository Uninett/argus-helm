suite: ingress
templates:
  - ingress.yaml
tests:
  - it: should not render when ingress is disabled
    set:
      ingress.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should be an Ingress when enabled
    set:
      ingress.enabled: true
    asserts:
      - isKind:
          of: Ingress

  - it: should have correct name
    release:
      name: my-release
    set:
      ingress.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: my-release-argus

  - it: should set ingressClassName on modern Kubernetes
    set:
      ingress.enabled: true
      ingress.className: haproxy
    capabilities:
      kubeVersion: "1.19.0"
    asserts:
      - equal:
          path: spec.ingressClassName
          value: haproxy

  - it: should set host rule
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: argus.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - equal:
          path: spec.rules[0].host
          value: argus.example.com

  - it: should set path on rule
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: argus.example.com
          paths:
            - path: /api
              pathType: Prefix
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /api

  - it: should set TLS when configured
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: argus-tls
          hosts:
            - argus.example.com
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: argus-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: argus.example.com

  - it: should not have tls section when not configured
    set:
      ingress.enabled: true
      ingress.tls: []
    asserts:
      - notExists:
          path: spec.tls

  - it: should set ingress annotations when specified
    set:
      ingress.enabled: true
      ingress.annotations:
        kubernetes.io/tls-acme: "true"
    asserts:
      - equal:
          path: metadata.annotations["kubernetes.io/tls-acme"]
          value: "true"

  - it: should use modern backend format on Kubernetes 1.19+
    release:
      name: my-release
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: argus.example.com
          paths:
            - path: /
              pathType: Prefix
      service.port: 80
    capabilities:
      kubeVersion: "1.19.0"
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: my-release-argus
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80
