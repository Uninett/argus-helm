suite: deployment-workers
templates:
  - deployments/workers.yaml
tests:
  - it: should be a Deployment
    asserts:
      - isKind:
          of: Deployment

  - it: should have correct name
    release:
      name: my-release
    asserts:
      - equal:
          path: metadata.name
          value: my-release-argus-workers

  - it: should have db-worker container
    asserts:
      - contains:
          path: spec.template.spec.containers
          content:
            name: argus-db-worker
          any: true

  - it: should pass workers args
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: /cmd-dbqueue.sh

  - it: should have check-db-ready init container
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: check-db-ready
          any: true

  - it: should have workers component label
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: workers

  - it: should use the same image as the main deployment
    set:
      image.repository: ghcr.io/uninett/argus
      image.tag: "2.9.1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/uninett/argus:2.9.1"

  - it: should mount django-settings volume when configmap is set
    set:
      argus.djangoSettingsModuleConfigMap: my-settings-cm
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: django-settings
            configMap:
              name: my-settings-cm
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: django-settings
            mountPath: "/extrapython/argussettings"
          any: true

  - it: should mount django-logging volume when configmap is set
    set:
      argus.djangoLoggingModuleConfigMap: my-logging-cm
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: django-logging
            configMap:
              name: my-logging-cm
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: django-logging
            mountPath: "/extrapython/arguslogging"
          any: true
