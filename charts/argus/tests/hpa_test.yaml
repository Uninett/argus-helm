suite: hpa
templates:
  - hpa.yaml
tests:
  - it: should not render when autoscaling is disabled
    set:
      autoscaling.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render HPA when autoscaling is enabled
    set:
      autoscaling.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HorizontalPodAutoscaler

  - it: should have correct name
    release:
      name: my-release
    set:
      autoscaling.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: my-release-argus

  - it: should target the correct deployment
    release:
      name: my-release
    set:
      autoscaling.enabled: true
    asserts:
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment
      - equal:
          path: spec.scaleTargetRef.name
          value: my-release-argus

  - it: should set min and max replicas
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 10
    asserts:
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 10

  - it: should include CPU metric when targetCPUUtilizationPercentage is set
    set:
      autoscaling.enabled: true
      autoscaling.targetCPUUtilizationPercentage: 75
    asserts:
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: cpu
              targetAverageUtilization: 75

  - it: should include memory metric when targetMemoryUtilizationPercentage is set
    set:
      autoscaling.enabled: true
      autoscaling.targetMemoryUtilizationPercentage: 80
    asserts:
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: memory
              targetAverageUtilization: 80

  - it: should not include memory metric when targetMemoryUtilizationPercentage is not set
    set:
      autoscaling.enabled: true
      autoscaling.targetCPUUtilizationPercentage: 75
    asserts:
      - notContains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: memory
